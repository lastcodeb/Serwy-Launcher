name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --console=plain

      # No Pixabay key in CI: the APK builds and runs, the screensaver just has no footage
      - name: Build release APK
        run: bash ./gradlew assembleRelease "-Ppixabay.apiKey=" --console=plain

      - uses: actions/upload-artifact@v5
        with:
          name: serwy-launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
